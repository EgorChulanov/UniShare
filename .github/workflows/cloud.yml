name: UniShare Cloud (Telegram / VK / Web)

on:
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  pull_request:
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  workflow_dispatch:

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unishare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (auth signatures + end-to-end API on PostgreSQL)
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/unishare
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build -t unishare-app cloud

  # Optional continuous deployment to your VM. Add repository secrets
  # DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY to enable it.
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: echo "enabled=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'cd /opt/unishare && git pull --ff-only && cd cloud/deploy && sudo docker compose --env-file ../.env up -d --build'
