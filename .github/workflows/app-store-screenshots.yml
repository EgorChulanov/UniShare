name: Capture App Store Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iphone
            preferred: iPhone 17 Pro Max
            fallback: iPhone 16 Pro Max
          - family: ipad
            preferred: iPad Pro 13-inch (M5)
            fallback: iPad Pro 13-inch (M4)
    steps:
      - uses: actions/checkout@v5
      - name: Install tooling
        run: brew install xcodegen jq
      - name: Create build configuration
        run: |
          cat > Config/Secrets.xcconfig <<'EOF'
          SUPABASE_URL = https:/$()/placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY = sb_publishable_screenshot_placeholder
          SUPABASE_ANON_KEY = $(SUPABASE_PUBLISHABLE_KEY)
          EOF
          xcodegen generate --spec project.yml
      - name: Capture ${{ matrix.family }} screenshots
        env:
          UNISHARE_SCREENSHOT_URL: ${{ secrets.SUPABASE_URL }}
          UNISHARE_SCREENSHOT_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          UNISHARE_SCREENSHOT_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          UNISHARE_SCREENSHOT_PASSWORD: ${{ secrets.APP_REVIEW_PASSWORD }}
          UNISHARE_SCREENSHOT_DEVICE: ${{ matrix.family }}
          SHOT_FAMILY: ${{ matrix.family }}
          PREFERRED_DEVICE: ${{ matrix.preferred }}
          FALLBACK_DEVICE: ${{ matrix.fallback }}
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)][-1].identifier')
          device_type=$(xcrun simctl list devicetypes -j | jq -r --arg preferred "$PREFERRED_DEVICE" --arg fallback "$FALLBACK_DEVICE" '
            ([.devicetypes[] | select(.name == $preferred)][0] // [.devicetypes[] | select(.name == $fallback)][0] // empty).identifier
          ')
          test -n "$runtime" && test -n "$device_type"
          device_id=$(xcrun simctl create "UniShare $SHOT_FAMILY Screenshots" "$device_type" "$runtime")
          trap 'xcrun simctl delete "$device_id" || true' EXIT
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild test \
            -project UniShare.xcodeproj \
            -scheme UniShare \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath "Results-$SHOT_FAMILY.xcresult" \
            -only-testing:UniShareUITests/AppStoreScreenshotTests/testCaptureAppStoreScreenshots \
            "UNISHARE_SCREENSHOT_URL=$UNISHARE_SCREENSHOT_URL" \
            "UNISHARE_SCREENSHOT_KEY=$UNISHARE_SCREENSHOT_KEY" \
            "UNISHARE_SCREENSHOT_EMAIL=$UNISHARE_SCREENSHOT_EMAIL" \
            "UNISHARE_SCREENSHOT_PASSWORD=$UNISHARE_SCREENSHOT_PASSWORD" \
            "UNISHARE_SCREENSHOT_DEVICE=$UNISHARE_SCREENSHOT_DEVICE" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "screenshots/$SHOT_FAMILY"
          xcrun xcresulttool export attachments \
            --path "Results-$SHOT_FAMILY.xcresult" \
            --output-path "screenshots/$SHOT_FAMILY"
          find "screenshots/$SHOT_FAMILY" -type f -name '*.png' -print
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-${{ matrix.family }}
          path: screenshots/${{ matrix.family }}/*.png
          if-no-files-found: error
