name: UniShare
options:
  bundleIdPrefix: com.egorchulanov
  deploymentTarget:
    iOS: "16.1"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.51.0"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  UniShare:
    type: application
    platform: iOS
    sources:
      - path: UniShare
        excludes:
          - "Resources/Assets.xcassets"
          - "Resources/Fonts"
      - path: UniShare/Resources/Assets.xcassets
      - path: UniShare/Resources/Fonts
        buildPhase: resources
    info:
      path: UniShare/Info.plist
      properties:
        CFBundleDisplayName: UniShare
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - unishare
            CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        NSPhotoLibraryUsageDescription: "UniShare needs photo library access to share images in chats"
        NSBluetoothAlwaysUsageDescription: "UniShare uses Bluetooth to find nearby users with AirShare"
        NSMotionUsageDescription: "UniShare detects shake gestures for AirShare"
        UIAppFonts:
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - ArchivoBlack-Regular.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: UniShare/UniShare.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    dependencies:
      - package: Supabase
        product: Supabase
      - target: UniShareWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(UNISHARE_APP_BUNDLE_ID)"
        PRODUCT_NAME: UniShare
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: FLSHXRH925
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(UNISHARE_APP_PROFILE)"

  UniShareWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: UniShareWidget
    info:
      path: UniShareWidget/Info.plist
      properties:
        CFBundleDisplayName: UniShare
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: UniShareWidget/UniShareWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(UNISHARE_WIDGET_BUNDLE_ID)"
        PRODUCT_NAME: UniShareWidget
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: FLSHXRH925
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        EXTENSION_ATTRIBUTES: WidgetKitExtension
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(UNISHARE_WIDGET_PROFILE)"

  UniShareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UniShareTests
    dependencies:
      - target: UniShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egorchulanov.unishare.Tests
        PRODUCT_NAME: UniShareTests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES

  UniShareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UniShareUITests
    dependencies:
      - target: UniShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egorchulanov.unishare.UITests
        PRODUCT_NAME: UniShareUITests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UniShare:
    build:
      targets:
        UniShare: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UniShareTests
        - UniShareUITests
      environmentVariables:
        UNISHARE_E2E_URL: "$(UNISHARE_E2E_URL)"
        UNISHARE_E2E_KEY: "$(UNISHARE_E2E_KEY)"
        UNISHARE_SCREENSHOT_URL: "$(UNISHARE_SCREENSHOT_URL)"
        UNISHARE_SCREENSHOT_KEY: "$(UNISHARE_SCREENSHOT_KEY)"
        UNISHARE_SCREENSHOT_EMAIL: "$(UNISHARE_SCREENSHOT_EMAIL)"
        UNISHARE_SCREENSHOT_PASSWORD: "$(UNISHARE_SCREENSHOT_PASSWORD)"
        UNISHARE_SCREENSHOT_DEVICE: "$(UNISHARE_SCREENSHOT_DEVICE)"
    archive:
      config: Release
